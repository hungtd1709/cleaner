[package]
name = "cleaner"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Small, fast and safe disk cleaner for macOS and Windows"
license = "MIT"
publish = false

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[features]
# Development aid: start a scan at launch and open the category named in CLEANER_VIEW.
# Never enabled for `cargo xtask dist`.
autoscan = []

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "system_fonts", "accesskit"] }
egui_extras = { version = "0.37", default-features = false }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSFileManager", "NSObject", "NSProcessInfo", "NSString", "NSURL", "NSValue"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSRunningApplication", "NSWorkspace"] }

[target.'cfg(windows)'.dependencies]
trash = { version = "5.3", default-features = false, features = ["coinit_apartmentthreaded"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Build scripts and the xtask helper do not need to be fast.
[profile.release.build-override]
opt-level = 0
