[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# `cargo xtask icons` needs these; `cargo xtask dist` does not.
icons = ["dep:resvg", "dep:ico", "dep:icns"]

[dependencies]
resvg = { version = "0.49", default-features = false, optional = true }
ico = { version = "0.6", optional = true }
icns = { version = "0.5", optional = true }
